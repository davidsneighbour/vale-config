# Version: 0.4.0

StylesPath = styles
MinAlertLevel = suggestion
Vocab = DNB, Tech, Thailand, AIDetectionExceptions, MillennialismsExceptions

# Ignoring scopes
# List of inline-level HTML tags to ignore
IgnoredScopes = code, tt, frontmatter.applyTo
# List of block-level HTML tags to ignore
SkippedScopes = script, style, pre, blockquote
# List of ignored HTML classes
IgnoredClasses = highlight

[formats]
mdx = md

[*.{md,txt}]
BasedOnStyles = Vale, DNBWriting, DNBAIPatterns, DNBMillennialisms

# rules from Vale
Vale.Spelling = NO # DNBWriting.Spelling uses the bundled British English dictionary.
# rules from DNBWriting
DNBWriting.OpenlyA11Y = warning
DNBWriting.OpenlyAnthropomorphism = warning
DNBWriting.OpenlyBut = warning
DNBWriting.OpenlyClarity = warning
DNBWriting.OpenlyEPrime = warning
DNBWriting.OpenlyFutureTense = warning
DNBWriting.OpenlyGenderBias = warning
DNBWriting.OpenlyHeadingsPunctuation = warning
DNBWriting.OpenlyHedging = warning
DNBWriting.OpenlyHyphens = warning
DNBWriting.OpenlyLink = warning
DNBWriting.OpenlyQuoteType = warning
DNBWriting.OpenlySentenceLength = warning
DNBWriting.OpenlySo = warning
DNBWriting.OpenlyThereIs = warning
DNBWriting.OpenlyTitles = warning
DNBWriting.OpenlyUnclearAntecedent = warning
DNBWriting.OpenlyVerbingNouns = warning

# rules from DNBMillennialisms
DNBMillennialisms.OptionalBroadTerms = NO

[*.md]
# Exclude `{{< ... >}}`, `{{% ... %}}`, [Who]({{< ... >}}), with or without
# the spaces inside the delimiters: Hugo reads `{{<ref "a.md">}}` too.
TokenIgnores = ({{[%<] ?.* ?[%>]}}.*?{{[%<] ?/.* ?[%>]}}), \
(\[.+\]\({{< ?.+ ?>}}\)), \
(?m)(?:^|[^\S\r\n])({{[%<] ?[\w/-]+(?: .+?)? ?[%>]}})(?=\s), \
[^\S\r\n]({{[%<](?:/\*) .* (?:\*/)[%>]}})\s

# Exclude `{{<  myshortcode `This is some <b>HTML</b>, ... >}}`
BlockIgnores = (?sm)^({{[%<] ?[\w/-]+\s(?:[^{]*?\s)?[%>]}})\n$, \
(?s) *({{< highlight [^>]* ?>}}.*?{{< ?/ ?highlight >}})
