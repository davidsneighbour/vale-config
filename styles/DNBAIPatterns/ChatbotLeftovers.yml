# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: Found chatbot artefact "%s"; remove pasted AI interface metadata or boilerplate.
level: error
ignorecase: true
scope: raw
tokens:
  - \bas\s+an\s+ai(?:\s+language)?\s+model\b|\bas\s+of\s+my\s+last\s+(?:update|training)\b|\bknowledge\s+cutoff\b|\bI\s+(?:cannot|can['’]t|do\s+not|don['’]t)\s+(?:browse\s+the\s+internet|access\s+real-?time)\b|contentReference|oaicite|turn[0-9]+(?:search|news|image)[0-9]*|attributableIndex|utm_source=
nonword: true
