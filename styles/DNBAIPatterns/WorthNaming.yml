# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is reflective AI-associated phrasing; consider naming the point plainly.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - '(?:\b(?:is|are|was|were|feels?|felt|seems?|seemed)|[''’]s)\s+(?:\w+\s+){0,2}?worth\s+naming\b(?!\s+names\b)|\bworth\s+naming\s*:'
nonword: true
