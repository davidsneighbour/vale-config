# Deprecated 2026-11-25: Promotional language is listed under Historical indicators (2023–2025) (Wikipedia revision 1387041075, WP:AIPUFFERY).
# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is promotional boilerplate; consider replacing it with specific detail.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - \bnestled\s+(?:in|on|among|between|along|at)\b|\bin\s+the\s+heart\s+of\b|\brich\s+(?:cultural\s+|historical\s+)?(?:heritage|history|tapestry)\b|\bhidden\s+gem\b|\bmust-(?:visit|see|try)\b|\bbreathtaking\b|\bboasts?\s+(?:a|an|the)\b|\bstunning\s+(?:views?|scenery|architecture|backdrop)\b
nonword: true
