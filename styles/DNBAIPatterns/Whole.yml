# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is a broad rhetorical claim; consider naming the specific point.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - \b(?:that|this)(?:['’]s|\s+(?:is|was))\s+the\s+whole\b(?:\s+\w+)?
nonword: true
