# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is an AI-associated reflective writing pattern; consider making the claim more concrete.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - \byou\s+already\s+knows?\s+(?:the\s+answer|what|how|why|this|that|it|who|where)\b|\byou\s+already\s+knows?\b(?![ \t]+\w)
nonword: true
