# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is inflated significance phrasing; consider naming the evidence directly.'
level: warning
ignorecase: true
scope: ~blockquote
tokens:
  - \b(?:stand|stands|stood|serve|serves|served|standing|serving)\s+as\s+(?:a|an)\s+(?:\w+\s+)?(?:testament|reminder)\b|\b(?:is|was|are|were|remain|remains)\s+a\s+(?:\w+\s+)?testament\s+to\b
nonword: true
