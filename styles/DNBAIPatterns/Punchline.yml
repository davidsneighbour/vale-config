# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is a stock reveal phrase; consider stating the conclusion directly.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - \bthe\s+punchline(?:\s+(?:is|was|being)\b|\s*[:?])
nonword: true
