# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is a stock understatement; consider naming the concrete significance.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - \b(?:that|this|it|which)(?:['’]s|\s+(?:is|was))\s+not\s+nothing\b
nonword: true
