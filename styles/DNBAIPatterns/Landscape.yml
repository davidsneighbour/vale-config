# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is AI-associated scene-setting boilerplate; consider naming the specific context.'
level: warning
ignorecase: true
scope: ~blockquote
tokens:
  - \b(?:ever-)?(?:evolving|changing|shifting)\s+landscape\b|\bin\s+today['’]s\s+(?:fast-paced|ever-changing|ever-evolving|digital|modern|competitive)\s+\w+
nonword: true
