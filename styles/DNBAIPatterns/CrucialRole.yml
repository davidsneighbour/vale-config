# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is an AI-writing cliche; name the role more specifically.'
level: warning
ignorecase: true
scope: ~blockquote
tokens:
  - \bplay(?:s|ed|ing)?\s+(?:a|an)\s+(?:\w+\s+)?(?:crucial|pivotal|vital|key|significant|central|critical|important)\s+role\b
nonword: true
