# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is a familiar rhetorical contrast; consider stating the contrast directly.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - \bnot\s+(?:just|only|merely|simply)\s+[^.!?\n;]*?\bbut(?:\s+also)?\b|\b(?:it|this|that)(?:['’]s|\s+(?:is|was))\s+not\s+[^.!?\n,;—–]{1,60}[,;—–]\s*(?:it|this|that)(?:['’]s|\s+(?:is|was))\b
nonword: true
