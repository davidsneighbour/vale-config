# Observable writing pattern, not a claim of AI authorship.
# Source variants are covered by native Vale regression cases.
extends: existence
message: '"%s" is a broad rhetorical construction; consider a more specific claim.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - (?:\b(?:is|was|are|were)|['’]s)\s+the\s+entire\b(?:\s+\w+)?
  - \bthe\s+entire\s+[\w'’-]+(?:\s+[\w'’-]+){0,4}?\s+(?:is|was|are|were)\b
nonword: true
