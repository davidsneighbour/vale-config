# Highlighter audit (2026-11-24): reference pattern(s) not-nothing.
# Coverage and missing specifics are documented below; detection behaviour is unchanged.
# The reference accepts that/this/it/which with is/was or straight/curly contractions.
# This rule only lists that's/that is/this is/it is/which is. It misses "it's", "this's", "which's", all was forms, and curly apostrophes.
# Reference expressions and verified cases: documentation/aidetection-highlighter-audit.json.
extends: existence
message: '"%s" is a stock understatement; consider naming the concrete significance.'
level: suggestion
ignorecase: true
scope: ~blockquote
tokens:
  - '\b(?:that''s|that is|this is|it is|which is)\s+not\s+nothing\b'
