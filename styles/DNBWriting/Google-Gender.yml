extends: existence
message: "Don't use '%s' as a gender-neutral pronoun."
link: "https://developers.google.com/style/pronouns#gender-neutral-pronouns"
level: error
ignorecase: true
tokens:
  - he/she
  - s/he
  - \(s\)he
