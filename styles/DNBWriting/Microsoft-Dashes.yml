# Source: https://github.com/vale-cli/Microsoft/releases/download/v0.15.2/Microsoft.zip (Dashes.yml)
# Licence: styles/DNBWriting/licenses/Microsoft/LICENSE
extends: existence
message: "Remove the spaces around '%s'."
link: https://learn.microsoft.com/en-us/style-guide/punctuation/dashes-hyphens/emes
ignorecase: true
nonword: true
level: error
action:
  name: edit
  params:
    - trim
    - " "
tokens:
  - '\s[—–]\s|\s[—–]|[—–]\s'
