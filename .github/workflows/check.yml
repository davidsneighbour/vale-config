name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install Vale
        env:
          VALE_VERSION: 3.28.1
          VALE_SHA256: 068954ad869ebec24b8dec6ebcd1cbb1fd5f5a83e966a35baedfae8b2cdc093a
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            --output "${RUNNER_TEMP}/vale.tar.gz"
          printf '%s  %s\n' "${VALE_SHA256}" "${RUNNER_TEMP}/vale.tar.gz" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/vale-bin"
          tar -xzf "${RUNNER_TEMP}/vale.tar.gz" -C "${RUNNER_TEMP}/vale-bin" vale
          echo "${RUNNER_TEMP}/vale-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
